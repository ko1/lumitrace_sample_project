name: Lumitrace Sample

on:
  pull_request:
  push:

jobs:
  run-lumitrace:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"

      - name: Install dependencies
        run: bundle install

      - name: Compute diff range
        run: |
          echo "event: ${{ github.event_name }}"
          echo "ref: ${{ github.ref }}"
          echo "base_ref: ${{ github.base_ref }}"
          echo "head_ref: ${{ github.head_ref }}"
          echo "sha: ${{ github.sha }}"
          echo "before: ${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "pr.base.sha: ${{ github.event.pull_request.base.sha }}"
            echo "pr.head.sha: ${{ github.event.pull_request.head.sha }}"
          fi
          echo "git HEAD: $(git rev-parse HEAD)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "git base ref: $(git rev-parse origin/${{ github.base_ref }})"
            echo "git merge-base: $(git merge-base origin/${{ github.base_ref }} HEAD)"
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
            echo "LUMITRACE_GIT_DIFF=range:${BASE_SHA}...HEAD" >> "$GITHUB_ENV"
          else
            echo "LUMITRACE_GIT_DIFF=range:${{ github.event.before }}...${{ github.sha }}" >> "$GITHUB_ENV"
          fi

      - name: Run tests with Lumitrace
        run: bundle exec lumitrace -v -t --html=lumitrace_recorded.html exec rake test

      - name: Prepare Pages content
        run: |
          mkdir -p public
          cp lumitrace_recorded.html public/index.html

      - name: Upload Lumitrace HTML
        uses: actions/upload-artifact@v4
        with:
          name: lumitrace-recorded-html
          path: lumitrace_recorded.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
          name: lumitrace-pages

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: lumitrace-pages

      - name: Artifact URL
        run: |
          echo "Artifact URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "Pages URL: ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
